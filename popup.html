<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popup Image Gallery</title>

    <style>
        body {
            font-family: "Poppins", sans-serif;
            background: #fafafa;
            margin: 0;
            padding: 0;
        }

        .gallery {
            text-align: center;
            padding: 40px 20px;
        }

        .gallery h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #333;
        }

        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .gallery-item {
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover {
            transform: scale(1.05);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Popup Styles */
        .popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .popup.active {
            display: flex;
        }

        .popup-img {
            max-width: 80%;
            max-height: 80%;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(255,255,255,0.3);
            animation: zoomIn 0.3s ease;
        }

        @keyframes zoomIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .close {
            position: absolute;
            top: 40px;
            right: 60px;
            font-size: 40px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .close:hover {
            color: #ff6666;
        }

    </style>
</head>
<body>
<section class="gallery">
    <h1>Photo Gallery</h1>
    <div class="gallery-container">
        <div class="gallery-item">
            <img src="GingerMedia/GingerHomePageRecommend/Dalian1.JPG" alt="Photo 1">
        </div>
        <div class="gallery-item">
            <img src="GingerMedia/GingerHomePageRecommend/Dalian1.JPG" alt="Photo 2">
        </div>
        <div class="gallery-item">
            <img src="GingerMedia/GingerHomePageRecommend/Dalian1.JPG" alt="Photo 3">
        </div>
        <div class="gallery-item">
            <img src="GingerMedia/GingerHomePageRecommend/Dalian1.JPG" alt="Photo 4">
        </div>
        <div class="gallery-item">
            <img src="GingerMedia/GingerHomePageRecommend/Dalian1.JPG" alt="Photo 5">
        </div>
    </div>
</section>

<!-- Popup -->
<div class="popup" id="popup">
    <span class="close">&times;</span>
    <img class="popup-img" src="" alt="Popup">
</div>

<script>
    const galleryItems = document.querySelectorAll('.gallery-item img');
    const popup = document.getElementById('popup');
    const popupImg = document.querySelector('.popup-img');
    const closeBtn = document.querySelector('.close');

    galleryItems.forEach(img => {
        img.addEventListener('click', () => {
            popup.classList.add('active');
            popupImg.src = img.src;
        });
    });

    closeBtn.addEventListener('click', () => {
        popup.classList.remove('active');
    });

    popup.addEventListener('click', (e) => {
        if (e.target === popup) popup.classList.remove('active');
    });

</script>
</body>
</html>
