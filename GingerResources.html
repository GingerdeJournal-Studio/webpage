<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GingerResources</title>
    <link rel="stylesheet" href="cssFiles/EveryPageCSS/GingerWholePageBox.css">
    <link rel="stylesheet" href="cssFiles/EveryPageCSS/GingerHeader.css">
    <link rel="stylesheet" href="cssFiles/EveryPageCSS/GingerFooter.css">
    <link rel="stylesheet" href="cssFiles/GingerResources.css">
    <script src="javascriptFiles/GingerHeader.js"></script>
    <script src="https://kit.fontawesome.com/cb86199370.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="whole-page-box">
        <!--HEADER START-->
        <div class="ginger-header">
            <nav class = "header-menu">
                <a href="index.html"><img class = "logo" src="GingerMedia/Icons/GingerLogo.png" alt="logo"></a>
                <a href="index.html"><img class = "logoChanged" src="GingerMedia/Icons/GingerLogoChanged.png" alt="logo"></a>
                <ul>
                    <li class = "menu"><a href="index.html">Home</a></li>
                    <li class = "menu"><a id="menu-here" href="GingerResources.html">GingerResources</a></li>
                    <li class = "menu"><a href="GingerBlog.html">Blog</a></li>
                    <li class = "menu"><a href="GingerContact.html">Contact</a></li>
                    <li onclick = showSidebar() class = "mobile-menu"><a href="#"><i class="fa-solid fa-bars"></i></a></li>
                </ul>

                <ul class = "sidebar">
                    <li onclick = closeSidebar() class = "mobile-menu"><a href="#"><i class="fa-solid fa-x"></i></a></li>
                    <li><a href="index.html">Home</a></li>
                    <li><a  id="mobile-menu-here" href="GingerResources.html">GingerResources</a></li>
                    <li><a href="GingerBlog.html">Blog</a></li>
                    <li><a href="GingerContact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
        <!--HEADER END-->

        <!--CONTENT START-->
        <div class="ginger-content">
            <div class="header">
                <div class="header-info"><h1>GingerResources</h1><p>Explore free photography presets, textures, fonts and quick guides — crafted for travel & street creators.</p>
                   <button> <a href="GingerBlog.html">View My Blog</a></button></div>
                <div class="header-info-img"><img src="GingerMedia/GingerHomePageRecommend/Dalian1.JPG" alt=""></div>
            </div>

            <div class="filter-button">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="landscape">Landscape</button>
                <button class="filter-btn" data-filter="animals">Animals</button>
                <button class="filter-btn" data-filter="wildlife">Wildlife</button>
                <button class="filter-btn" data-filter="macro">Macro</button>
                <button class="filter-btn" data-filter="black-and-white">Black and White</button>
            </div>

            <div class="filter-cards">
                <div class="filter-cards-crd">
                    <div class="filter-cards-info all"></div>
                    <div class="filter-cards-info landscape"></div>
                    <div class="filter-cards-info animals"></div>
                    <div class="filter-cards-info wildlife"></div>
                    <div class="filter-cards-info macro"></div>
                    <div class="filter-cards-info black-and-white"></div>
                </div>

                <aside class="aside-content">
                    <div class="quick-tips"></div>
                    <div class="featured-guides"></div>
                    <div class="usage-rules"></div>
                </aside>
            </div>
        </div>
        <!--CONTENT END-->

        <!--FOOTER START
        <div class="ginger-footer">

        </div>
        FOOTER END-->
    </div>
</body>
    <script>
        document.addEventListener("scroll", () => {
            const header = document.querySelector('.header-menu');
            if(window.scrollY > 0)
                header.classList.add('scrolled');
            else
                header.classList.remove('scrolled');
        })

        const filterButtons = document.querySelectorAll(".filter-btn");
        const galleryItems = document.querySelectorAll(".filter-cards-info");

        filterButtons.forEach((button) => {
            button.addEventListener("click", () => {
                filterButtons.forEach((btn) => {
                    btn.classList.remove("active");
                })

                button.classList.add("active");

                const filterValue = button.dataset.filter;

                galleryItems.forEach((item) => {
                    if(filterValue === "all" || item.classList.contains(filterValue)) {
                        item.classList.remove("hidden");
                    }
                    else {
                        item.classList.add("hidden");
                    }
                })
            })
        })
    </script>
</html>
