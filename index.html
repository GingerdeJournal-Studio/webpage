</head>
<body>
    <div class="whole-page-box">
        <!--HEADER START-->
        <div class="ginger-header">

            <video autoplay loop muted class = "video" src="GingerMedia/Videos/GingerHeader.MOV"></video>

            <nav class = "header-menu-index">
                <a href="index.html"><img class = "logo" src="GingerMedia/Icons/GingerLogo.png" alt="logo"></a>
                <ul>
                    <li class = "menu"><a id="menu-here" href="index.html">Home</a></li>
                    <li class = "menu"><a href="GingerResources.html">GingerResources</a></li>
                    <li class = "menu"><a href="GingerBlog.html">Blog</a></li>
                    <li class = "menu"><a href="GingerContact.html">Contact</a></li>
                    <li onclick = showSidebar() class = "mobile-menu"><a href="#"><i class="fa-solid fa-bars"></i></a></li>
                </ul>

                <ul class = "sidebar">
                    <li onclick = closeSidebar() class = "mobile-menu-x"><a href="#"><i class="fa-solid fa-x"></i></a></li>
                    <li><a id="mobile-menu-here" href="index.html">Home</a></li>
                    <li><a href="GingerResources.html">GingerResources</a></li>
                    <li><a href="GingerBlog.html">Blog</a></li>
                    <li><a href="GingerContact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
        <!--HEADER END-->

        <!--CONTENT START-->
        <div class="ginger-content">
            <div class="recommend-photos">
                <div class="title">
                    <h3>GingerMedia</h3>
                    <h1>RECOMMEND</h1>
                </div>
                <div class="pictures">
                    <a target="_blank" href="GingerPhotoDownloadFiles/Lianjiang/Lianjiang1.html"><img width="300px" src="GingerMedia/Photos/GingerHomePageRecommend/Lianjiang1.JPG" alt=""></a>

                    <a target="_blank" href="GingerPhotoDownloadFiles/Pingtan/Pingtan1.html"><img width="300px" src="GingerMedia/Photos/GingerHomePageRecommend/Pingtan1.JPG" alt=""></a>
                    <a target="_blank" href="GingerPhotoDownloadFiles/Shaxian/Shaxian1.html"><img width="300px" src="GingerMedia/Photos/GingerHomePageRecommend/Shaxian1.JPG" alt=""></a>

        </div>
        <!--CONTENT END-->

        <!--FOOTER START-->
        <div class="ginger-footer">

        </div>
        <!--FOOTER END-->
    </div>
</body>
    <script>
        document.addEventListener("scroll", () => {
            const header = document.querySelector('.header-menu-index');
            if((window.scrollY > window.innerHeight - 20) && window.innerWidth > 1400)
                header.classList.add('scrolled');
            else if((window.scrollY > window.innerHeight - 200) && window.innerWidth > 1000)
            header.classList.add('scrolled');
            else if((window.scrollY > 100) && window.innerWidth < 1000)
                header.classList.add('scrolled');
            else
                header.classList.remove('scrolled');
        })

        function showSidebar() {
            const sidebar = document.querySelector('.sidebar')
            sidebar.style.right = '0'
        }

        function closeSidebar() {
            const sidebar = document.querySelector('.sidebar')
            sidebar.style.right = '-280px'
        }
    </script>
</html>
