<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GingerContact</title>
    <link rel="stylesheet" href="cssFiles/EveryPageCSS/GingerWholePageBox.css">
    <link rel="stylesheet" href="cssFiles/EveryPageCSS/GingerContent.css">
    <link rel="stylesheet" href="cssFiles/EveryPageCSS/GingerHeader.css">
    <link rel="stylesheet" href="cssFiles/EveryPageCSS/GingerFooter.css">
    <link rel="stylesheet" href="cssFiles/GIngerContact.css">
    <script src="https://kit.fontawesome.com/cb86199370.js" crossorigin="anonymous"></script>
    <link rel="icon" type="svg" href="GingerMedia/Icons/WhiteGinger.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=DM+Serif+Text:ital@0;1&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="cssFiles/EveryPageCSS/fonts.css">
</head>
<body>
    <div class="whole-page-box">
        <!--HEADER START-->
        <div class="ginger-header">

            <nav class = "header-menu-index">
                <a href="index.html"><img class = "logo" src="GingerMedia/Icons/GingerLogo.png" alt="logo"></a>
                <a href="index.html"><img class = "logoChanged" src="GingerMedia/Icons/GingerLogoChanged.png" alt="logo"></a>
                <ul>
                    <li class = "menu"><a href="index.html">Home</a></li>
                    <li class = "menu"><a href="GingerResources.html">GingerResources</a></li>
                    <li class = "menu"><a href="GingerBlog.html">Blog</a></li>
                    <li class = "menu"><a id="menu-here" href="GingerContact.html">Contact</a></li>
                    <li onclick = showSidebar() class = "mobile-menu"><a href="#"><i class="fa-solid fa-bars"></i></a></li>
                </ul>

                <ul class = "sidebar">
                    <li onclick = closeSidebar() class = "mobile-menu-x"><a href="#"><i class="fa-solid fa-x"></i></a></li>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="GingerResources.html">GingerResources</a></li>
                    <li><a href="GingerBlog.html">Blog</a></li>
                    <li><a id="mobile-menu-here" href="GingerContact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
        <!--HEADER END-->

        <section class="form">
            <form action="https://api.web3forms.com/submit" method="POST" class="formLeft">
                <h1>Get in Touch with Us!</h1>
                <hr>
                <input type="hidden" name="access_key" value="aeb13dda-3026-4730-9826-9aab118f8917">
                <input type="text" name="name" placeholder="Your Name" required class="formInput">
                <input type="email" name="email" placeholder="Your Email" required class="formInput">
                <textarea name="message" placeholder="Your message" required class="formInput"></textarea>
                <button type="submit">Submit</button>
            </form>
            <div class="formRight">
                <div class="formImage"></div>
            </div>
        </section>
    </div>
</body>
    <script>
        document.addEventListener("scroll", () => {
        const header = document.querySelector('.header-menu');
        if(window.scrollY > 260 && window.innerWidth < 1000)
            header.classList.add('scrolled');
        else if(window.scrollY > 0 && window.innerWidth > 1000)
            header.classList.add('scrolled');
        else
            header.classList.remove('scrolled');
        })

        function showSidebar() {
            const sidebar = document.querySelector('.sidebar')
            sidebar.style.right = '0'
        }

        function closeSidebar() {
            const sidebar = document.querySelector('.sidebar')
            sidebar.style.right = '-280px'
        }
    </script>
</html>
